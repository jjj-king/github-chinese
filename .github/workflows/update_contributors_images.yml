name: Update contributors images in README.md
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Generate a token
        id: generate_token
        if: vars.APP_CLIENT_ID != '' || vars.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Contributors Images
        uses: jaywcjlove/github-action-contributors@v2.1.0
        id: contributors
        with:
          filter-author: (action-assistant\[bot\]|renovate\[bot\]|renovate-bot|@github-actions-bot|dependabot\[bot\]|ImgBotApp|imgbot\[bot\])
          avatarSize: 42

      - name: Modify README.md
        env:
          CONTRIBUTORS_HTML: ${{ steps.contributors.outputs.htmlList }}
        run: |
          node script/update-contributors.mjs README.md
          git diff --quiet --exit-code README.md || echo "CHANGES_DETECTED=true" >> $GITHUB_ENV

      - name: Commit and push README.md
        if: ${{ env.CHANGES_DETECTED == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.generate_token.outputs.app-slug || 'github-actions' }}
        run: |
          bash script/ci_commit_with_signature.sh \
          -R "${{ github.repository }}" \
          -B "${{ github.ref_name }}" \
          -P "${{ github.sha }}" \
          -F "README.md" \
          -h "修改文档: 更新\`贡献者列表\`"
